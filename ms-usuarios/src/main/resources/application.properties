spring.application.name=ms-usuarios
server.port=8081

# La base se crea sola si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/teqgastos_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true