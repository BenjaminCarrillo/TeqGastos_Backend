spring.application.name=ms-rendiciones
server.port=8082

# Base propia de este microservicio (se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/teqgastos_rendiciones?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Para que la app reciba el mensaje del error (por ejemplo "Este comprobante ya esta rendido en RND-...")
server.error.include-message=always
server.error.include-binding-errors=always
